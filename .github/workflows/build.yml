name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'
  # Repository variable SYDWALT_URL overrides the server baked into the app.
  SYDWALT_URL: ${{ vars.SYDWALT_URL || 'https://sydwalt-os-3f9ywa.fly.dev' }}

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bridge tests in Chromium
        working-directory: test_js
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing key (skipped when the secrets are not set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway debug key. Fine for testing, but devices cannot upgrade from it to a properly signed build without uninstalling first."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=SYDWALT_URL=$SYDWALT_URL
      - run: flutter build appbundle --release --dart-define=SYDWALT_URL=$SYDWALT_URL
      - name: Name the files after the version
        id: name
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+/-build/')
          echo "base=sydwalt-os-$v-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/sydwalt-os-$v-${GITHUB_SHA::7}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/sydwalt-os-$v-${GITHUB_SHA::7}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.base }}-android
          path: out/*
          retention-days: 30

  ios:
    name: iOS build check (unsigned)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=SYDWALT_URL=$SYDWALT_URL
